<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Cangrejo Vigía del Manglar del Atlántico">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE7D6"/>
    </radialGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38A3DC"/>
      <stop offset="55%" stop-color="#005F96"/>
      <stop offset="100%" stop-color="#08334C"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58BCEE"/>
      <stop offset="100%" stop-color="#0A6EA8"/>
    </linearGradient>
    <linearGradient id="goldHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8D86F"/>
      <stop offset="100%" stop-color="#D89D09"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="48" fill="url(#bgGlow)"/>
  <!-- Sombra suave sobre arena -->
  <ellipse cx="160" cy="258" rx="88" ry="16" fill="#08334C" opacity="0.12"/>
  <!-- Patas izquierdas y derechas -->
  <g stroke="#0A6EA8" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M98 188 Q62 192 52 220"/>
    <path d="M104 205 Q66 218 64 242"/>
    <path d="M115 218 Q84 236 88 252"/>
    <path d="M222 188 Q258 192 268 220"/>
    <path d="M216 205 Q254 218 256 242"/>
    <path d="M205 218 Q236 236 232 252"/>
  </g>
  <!-- Tenaza izquierda sosteniendo lupa -->
  <path d="M102 162 Q68 134 62 104" stroke="#0A6EA8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M44 92 C38 70 64 56 76 74 C66 80 68 92 78 96 C66 106 49 104 44 92 Z" fill="url(#clawGrad)"/>
  <!-- Lupa de explorador -->
  <g transform="translate(36, 46) rotate(-14)">
    <rect x="34" y="48" width="10" height="34" rx="5" fill="#7D4E24"/>
    <circle cx="38" cy="30" r="24" fill="#DDF4FF" fill-opacity="0.58" stroke="#EDB512" stroke-width="6"/>
    <path d="M24 20 A16 16 0 0 1 42 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  <!-- Tenaza derecha saludando -->
  <path d="M218 162 Q252 134 256 102" stroke="#0A6EA8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M276 92 C282 70 256 56 244 74 C254 80 252 92 242 96 C254 106 271 104 276 92 Z" fill="url(#clawGrad)"/>
  <!-- Caparazón -->
  <ellipse cx="160" cy="186" rx="76" ry="56" fill="url(#shellGrad)"/>
  <ellipse cx="160" cy="204" rx="52" ry="26" fill="#E8F6FC" opacity="0.22"/>
  <!-- Ojos -->
  <line x1="134" y1="142" x2="128" y2="118" stroke="#005F96" stroke-width="9" stroke-linecap="round"/>
  <line x1="186" y1="142" x2="192" y2="118" stroke="#005F96" stroke-width="9" stroke-linecap="round"/>
  <circle cx="127" cy="112" r="14" fill="#FFFFFF"/>
  <circle cx="193" cy="112" r="14" fill="#FFFFFF"/>
  <circle cx="129" cy="112" r="7" fill="#08334C"/>
  <circle cx="191" cy="112" r="7" fill="#08334C"/>
  <circle cx="132" cy="109" r="2.5" fill="#FFFFFF"/>
  <circle cx="194" cy="109" r="2.5" fill="#FFFFFF"/>
  <!-- Sonrisa -->
  <path d="M138 184 Q160 202 182 184" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="126" cy="178" r="6" fill="#F8D86F" opacity="0.55"/>
  <circle cx="194" cy="178" r="6" fill="#F8D86F" opacity="0.55"/>
  <!-- Sombrero vueltiao estilizado -->
  <g transform="translate(160, 126) rotate(-6)">
    <ellipse cx="0" cy="8" rx="54" ry="12" fill="url(#goldHat)" stroke="#08334C" stroke-width="2.5"/>
    <path d="M-28 6 Q-24 -22 0 -22 Q24 -22 28 6 Z" fill="url(#goldHat)" stroke="#08334C" stroke-width="2.5"/>
    <path d="M-24 -4 Q0 2 24 -4" stroke="#08334C" stroke-width="4" fill="none"/>
    <path d="M-40 8 L-28 8 M-14 9 L-4 9 M10 9 L20 9 M32 8 L42 8" stroke="#08334C" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
